[project]
name = "magate"
version = "0.5.4"
description = "maGATE — MCP・API接続先のセキュリティ審査ツール（ツールポイズニング・ラグプル・シャドーイング・トークン中継・過剰スコープ、OpenAPI対応）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
magate = "magate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["magate", "magate.checks"]
