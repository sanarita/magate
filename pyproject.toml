[project]
name = "mcp-gate"
version = "0.1.0"
description = "MCP接続先のセキュリティ審査エージェント（ツールポイズニング・ラグプル・シャドーイング・トークン中継・過剰スコープ）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mcp-gate = "mcpgate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcpgate", "mcpgate.checks"]
